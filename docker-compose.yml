services:
  postgres:
    image: postgres:15-alpine
    container_name: tradewatch_postgres
    restart: always
    environment:
      POSTGRES_USER: tradewatch
      POSTGRES_PASSWORD: tradewatch_secret
      POSTGRES_DB: tradewatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradewatch -d tradewatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tradewatch_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradewatch_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://tradewatch:tradewatch_secret@postgres:5432/tradewatch_db
      - DEFAULT_POLLING_INTERVAL_SEC=30
      - DEFAULT_ALERT_COOLDOWN_MIN=15
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tradewatch_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradewatch_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - tradewatch_net

volumes:
  postgres_data:
    driver: local

networks:
  tradewatch_net:
    driver: bridge
